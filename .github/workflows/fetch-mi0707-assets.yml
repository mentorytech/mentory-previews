name: Fetch MI Webinar 0707 Assets

on:
  workflow_dispatch:
    inputs:
      manifest_b64:
        description: Base64 JSON manifest with signed source URLs and target paths
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets without logging signed URLs
        env:
          MANIFEST_B64: ${{ github.event.inputs.manifest_b64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, time, sys
          import requests

          raw = base64.b64decode(os.environ['MANIFEST_B64']).decode('utf-8')
          manifest = json.loads(raw)
          out_manifest = []
          for item in manifest:
              target = pathlib.Path(item['path'])
              if not str(target).startswith('assets/email/mi-webinario-0707/'):
                  raise SystemExit(f'Unsafe target path: {target}')
              target.parent.mkdir(parents=True, exist_ok=True)
              ok = False
              last = ''
              for attempt in range(1, 5):
                  try:
                      r = requests.get(item['url'], headers={'User-Agent':'Mozilla/5.0'}, timeout=(10, 90))
                      ctype = r.headers.get('content-type','')
                      if r.status_code == 200 and r.content and (r.content[:8].startswith(b'\x89PNG') or r.content[:3] == b'\xff\xd8\xff'):
                          target.write_bytes(r.content)
                          ok = True
                          out_manifest.append({
                              'slug': item['slug'],
                              'block_id': item['block_id'],
                              'path': str(target),
                              'bytes': len(r.content),
                              'content_type': ctype,
                              'public_url': 'https://mentorytech.github.io/mentory-previews/' + str(target)
                          })
                          print(f"downloaded {item['slug']} -> {target} ({len(r.content)} bytes)")
                          break
                      last = f'status={r.status_code} ctype={ctype} bytes={len(r.content)}'
                  except Exception as e:
                      last = type(e).__name__
                  time.sleep(attempt * 3)
              if not ok:
                  raise SystemExit(f"failed {item['slug']}: {last}")
          pathlib.Path('assets/email/mi-webinario-0707/manifest.json').write_text(json.dumps(out_manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Commit assets
        run: |
          git config user.name "mentorytech-bot"
          git config user.email "tech@mentoryinternational.com"
          git add assets/email/mi-webinario-0707 .github/workflows/fetch-mi0707-assets.yml
          git commit -m "Add MI webinar 0707 email assets" || exit 0
          git push
